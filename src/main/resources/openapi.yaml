openapi: 3.0.3
info:
  contact:
    email: release@forgesphere.example.com
    name: ForgeSphere Release Engineering
  description: "Coordinates atomic, coordinated releases across multiple interdependent\
    \ \nrepositories. Prevents the classic \"repo A shipped, repo B didn't, \nproduction\
    \ broke\" problem by enforcing that all required repos are \nready before any\
    \ can deploy. Manages version pinning, release waves, \nand rollback of the entire\
    \ train.\n"
  title: Multi-Repo Release Train
  version: 1.0.0
servers:
- description: Production Server
  url: https://releasetrain.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8132/v1
security:
- bearerAuth: []
tags:
- description: Create and manage multi-repo release trains.
  name: Trains
- description: Control the rollout waves within a train.
  name: Waves
paths:
  /trains:
    post:
      description: "Defines a release train — a group of repositories that must ship\
        \ \ntogether in a specific order. The train enforces dependency order, \n\
        version pinning, and success gates between waves. Nothing deploys \nuntil\
        \ the entire train is validated.\n"
      operationId: createReleaseTrain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createReleaseTrain_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
          description: Release train created and validated.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A train with this name already exists.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Create a new multi-repo release train
      tags:
      - Trains
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Trains
  /trains/{trainId}:
    get:
      description: "Returns the current state of the release train — which wave is\
        \ \nactive, which repositories are deployed, success-gate results, and \n\
        any blockers. Safe to poll every 10 seconds during an active release.\n"
      operationId: getReleaseTrain
      parameters:
      - description: Unique identifier of the release train.
        example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        explode: false
        in: path
        name: trainId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
          description: Release train status retrieved successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Train ID not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get live status of a release train
      tags:
      - Trains
      x-accepts: application/json
      x-tags:
      - tag: Trains
  /trains/{trainId}/execute:
    post:
      description: "Controls the release train lifecycle. Actions: START begins the\
        \ \nfirst wave, PAUSE halts after the current wave, RESUME continues \nfrom\
        \ where it stopped, ROLLBACK reverts per the train's rollback \npolicy. Every\
        \ action is audited.\n"
      operationId: executeTrainAction
      parameters:
      - description: Unique identifier of the release train.
        explode: false
        in: path
        name: trainId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/executeTrainAction_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
          description: Action applied successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or missing required fields.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Train ID not found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Train is not in a state that supports this action.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: "Start, pause, resume, or rollback the release train"
      tags:
      - Trains
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Trains
  /trains/{trainId}/history:
    get:
      description: "Returns a chronological timeline of everything that happened during\
        \ \nthe train — wave transitions, gate results, rollbacks, and the final \n\
        outcome. Used for post-release review and compliance audits.\n"
      operationId: getTrainHistory
      parameters:
      - description: Unique identifier of the release train.
        explode: false
        in: path
        name: trainId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Page number (zero-based).
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Number of items per page.
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 50
          maximum: 200
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainHistory"
          description: Historical timeline of the train.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Train ID not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get the full execution history of a release train
      tags:
      - Trains
      x-accepts: application/json
      x-tags:
      - tag: Trains
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request payload or missing required fields.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Train ID not found.
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error.
  schemas:
    ReleaseTrain:
      example:
        trainId: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        waves:
        - completedAt: 2000-01-23T04:56:07.000+00:00
          gateResult:
            successRatePercent: 99.8
            observationMinutes: 15
            passed: true
            evaluatedAt: 2000-01-23T04:56:07.000+00:00
            errorRatePercent: 0.05
          repositories:
          - forgesphere/discount-engine
          name: foundation-libs
          startedAt: 2000-01-23T04:56:07.000+00:00
          strategy: CANARY_5_PERCENT
          waveNumber: 1
          status: PASSED
        - completedAt: 2000-01-23T04:56:07.000+00:00
          gateResult:
            successRatePercent: 99.8
            observationMinutes: 15
            passed: true
            evaluatedAt: 2000-01-23T04:56:07.000+00:00
            errorRatePercent: 0.05
          repositories:
          - forgesphere/discount-engine
          name: foundation-libs
          startedAt: 2000-01-23T04:56:07.000+00:00
          strategy: CANARY_5_PERCENT
          waveNumber: 1
          status: PASSED
        owner: payments-platform-team
        completedAt: 2000-01-23T04:56:07.000+00:00
        currentWave: 2
        description: Q4 payment platform release with new discount engine.
        startedAt: 2000-01-23T04:56:07.000+00:00
        totalWaves: 3
        createdAt: 2000-01-23T04:56:07.000+00:00
        environment: PRODUCTION
        repositories:
        - repoId: forgesphere/payment-service
          dependsOn:
          - forgesphere/discount-engine
          requiredVersion: v2.5.0
          deployed: true
          criticalPath: true
          deployedAt: 2000-01-23T04:56:07.000+00:00
          readinessStatus: READY
          deployedVersion: v2.5.0
        - repoId: forgesphere/payment-service
          dependsOn:
          - forgesphere/discount-engine
          requiredVersion: v2.5.0
          deployed: true
          criticalPath: true
          deployedAt: 2000-01-23T04:56:07.000+00:00
          readinessStatus: READY
          deployedVersion: v2.5.0
        trainName: payment-platform-v2.5
        progressPercent: 62
        blockers:
        - forgesphere/checkout-service v1.9.0 has not passed tests.
        - forgesphere/discount-engine dependency conflict detected.
        rollbackPolicy: ROLLBACK_WAVE
        targetReleaseDate: 2026-10-15T00:00:00.000+00:00
        status: RUNNING
      properties:
        trainId:
          example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
          format: uuid
          type: string
        trainName:
          example: payment-platform-v2.5
          type: string
        description:
          example: Q4 payment platform release with new discount engine.
          type: string
        environment:
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
          type: string
        status:
          enum:
          - DRAFT
          - VALIDATING
          - READY
          - RUNNING
          - PAUSED
          - SUCCEEDED
          - FAILED
          - ROLLING_BACK
          - ROLLED_BACK
          - ABORTED
          example: RUNNING
          type: string
        targetReleaseDate:
          example: 2026-10-15
          format: date
          type: string
        currentWave:
          description: "Wave currently being deployed (1-indexed, 0 if not started)."
          example: 2
          type: integer
        totalWaves:
          example: 3
          type: integer
        progressPercent:
          example: 62
          type: integer
        repositories:
          items:
            $ref: "#/components/schemas/ReleaseTrain_repositories_inner"
          type: array
        waves:
          items:
            $ref: "#/components/schemas/ReleaseTrain_waves_inner"
          type: array
        rollbackPolicy:
          enum:
          - ROLLBACK_ALL
          - ROLLBACK_WAVE
          - ROLLBACK_FAILED_ONLY
          - MANUAL
          example: ROLLBACK_WAVE
          type: string
        owner:
          example: payments-platform-team
          type: string
        createdAt:
          format: date-time
          type: string
        startedAt:
          format: date-time
          type: string
        completedAt:
          format: date-time
          type: string
        blockers:
          description: Reasons the train cannot proceed.
          example:
          - forgesphere/checkout-service v1.9.0 has not passed tests.
          - forgesphere/discount-engine dependency conflict detected.
          items:
            type: string
          type: array
      required:
      - createdAt
      - currentWave
      - environment
      - repositories
      - status
      - totalWaves
      - trainId
      - trainName
      - waves
      type: object
    TrainHistory:
      example:
        trainId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        size: 50
        totalPages: 1
        page: 0
        events:
        - actor: release-bot@forgesphere.example.com
          eventId: a1b2c3d4-e5f6-7890-1234-567890abcdef
          repoId: forgesphere/discount-engine
          occurredAt: 2000-01-23T04:56:07.000+00:00
          metadata:
            deployedVersion: v2.5.0
            durationSeconds: 272
          eventType: WAVE_COMPLETED
          detail: Wave 1 deployed successfully in 4m 32s.
          waveNumber: 1
        - actor: release-bot@forgesphere.example.com
          eventId: a1b2c3d4-e5f6-7890-1234-567890abcdef
          repoId: forgesphere/discount-engine
          occurredAt: 2000-01-23T04:56:07.000+00:00
          metadata:
            deployedVersion: v2.5.0
            durationSeconds: 272
          eventType: WAVE_COMPLETED
          detail: Wave 1 deployed successfully in 4m 32s.
          waveNumber: 1
        totalElements: 42
      properties:
        trainId:
          format: uuid
          type: string
        events:
          items:
            $ref: "#/components/schemas/TrainHistory_events_inner"
          type: array
        totalElements:
          example: 42
          type: integer
        totalPages:
          example: 1
          type: integer
        page:
          example: 0
          type: integer
        size:
          example: 50
          type: integer
      required:
      - events
      - totalElements
      - totalPages
      - trainId
      type: object
    ErrorResponse:
      properties:
        status:
          example: 409
          type: integer
        errorCode:
          example: TRAIN_ALREADY_RUNNING
          type: string
        message:
          example: Release train payment-platform-v2.5 is already running.
          type: string
        timestamp:
          format: date-time
          type: string
        path:
          example: /v1/trains/9c8f1a3b/execute
          type: string
        serviceTransactionId:
          example: 523f52b2-64a5-465e-b245-3efbe78f70ae
          type: string
      required:
      - message
      - path
      - status
      - timestamp
      type: object
    createReleaseTrain_request_repositories_inner:
      properties:
        repoId:
          example: forgesphere/payment-service
          type: string
        requiredVersion:
          description: Version or commit that must be deployed.
          example: v2.5.0
          type: string
        criticalPath:
          description: "If true, the train blocks if this repo isn't ready."
          example: true
          type: boolean
        dependsOn:
          description: Other repos this one depends on.
          example:
          - forgesphere/discount-engine
          items:
            type: string
          type: array
      required:
      - criticalPath
      - repoId
      - requiredVersion
      type: object
    createReleaseTrain_request_waves_inner_successGate:
      description: Conditions required before moving to the next wave.
      properties:
        minSuccessRatePercent:
          example: 99.5
          type: number
        maxErrorRatePercent:
          example: 0.1
          type: number
        observationMinutes:
          example: 15
          type: integer
      type: object
    createReleaseTrain_request_waves_inner:
      properties:
        waveNumber:
          example: 1
          type: integer
        name:
          example: foundation-libs
          type: string
        repositories:
          example:
          - forgesphere/discount-engine
          items:
            type: string
          type: array
        strategy:
          enum:
          - SEQUENTIAL
          - PARALLEL
          - CANARY_5_PERCENT
          - CANARY_25_PERCENT
          - BLUE_GREEN
          example: CANARY_5_PERCENT
          type: string
        successGate:
          $ref: "#/components/schemas/createReleaseTrain_request_waves_inner_successGate"
      required:
      - name
      - repositories
      - strategy
      - waveNumber
      type: object
    createReleaseTrain_request:
      properties:
        trainName:
          description: Unique name for this release train.
          example: payment-platform-v2.5
          type: string
        description:
          description: Optional description of the release scope.
          example: Q4 payment platform release with new discount engine.
          type: string
        environment:
          description: Target environment for the train.
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
          type: string
        targetReleaseDate:
          description: Planned release date.
          example: 2026-10-15
          format: date
          type: string
        repositories:
          description: All repositories participating in this train.
          items:
            $ref: "#/components/schemas/createReleaseTrain_request_repositories_inner"
          type: array
        waves:
          description: Ordered deployment waves.
          items:
            $ref: "#/components/schemas/createReleaseTrain_request_waves_inner"
          type: array
        rollbackPolicy:
          default: ROLLBACK_WAVE
          description: How to roll back if a wave fails.
          enum:
          - ROLLBACK_ALL
          - ROLLBACK_WAVE
          - ROLLBACK_FAILED_ONLY
          - MANUAL
          example: ROLLBACK_WAVE
          type: string
        owner:
          description: Team owning this train.
          example: payments-platform-team
          type: string
        notifyChannels:
          description: Channels to notify on train events.
          example:
          - SLACK
          - PAGERDUTY
          items:
            enum:
            - EMAIL
            - SLACK
            - PAGERDUTY
            - WEBHOOK
            type: string
          type: array
      required:
      - environment
      - repositories
      - trainName
      - waves
      type: object
    executeTrainAction_request:
      properties:
        action:
          description: Action to perform on the train.
          enum:
          - START
          - PAUSE
          - RESUME
          - ROLLBACK
          - ABORT
          example: START
          type: string
        reason:
          description: Reason for the action (min 15 chars).
          example: All pre-flight checks passed; starting release.
          minLength: 15
          type: string
        targetWave:
          description: Optional. Start or rollback from a specific wave.
          example: 1
          type: integer
        notifyChannels:
          description: Channels to notify of this action.
          example:
          - SLACK
          items:
            enum:
            - EMAIL
            - SLACK
            - PAGERDUTY
            - WEBHOOK
            type: string
          type: array
      required:
      - action
      - reason
      type: object
    ReleaseTrain_repositories_inner:
      example:
        repoId: forgesphere/payment-service
        dependsOn:
        - forgesphere/discount-engine
        requiredVersion: v2.5.0
        deployed: true
        criticalPath: true
        deployedAt: 2000-01-23T04:56:07.000+00:00
        readinessStatus: READY
        deployedVersion: v2.5.0
      properties:
        repoId:
          example: forgesphere/payment-service
          type: string
        requiredVersion:
          example: v2.5.0
          type: string
        criticalPath:
          example: true
          type: boolean
        deployed:
          example: true
          type: boolean
        deployedAt:
          format: date-time
          type: string
        deployedVersion:
          example: v2.5.0
          type: string
        readinessStatus:
          enum:
          - PENDING
          - READY
          - MISSING
          - INCOMPATIBLE
          example: READY
          type: string
        dependsOn:
          example:
          - forgesphere/discount-engine
          items:
            type: string
          type: array
      required:
      - criticalPath
      - deployed
      - repoId
      - requiredVersion
      type: object
    ReleaseTrain_waves_inner_gateResult:
      description: Result of the success gate for this wave.
      example:
        successRatePercent: 99.8
        observationMinutes: 15
        passed: true
        evaluatedAt: 2000-01-23T04:56:07.000+00:00
        errorRatePercent: 0.05
      properties:
        passed:
          example: true
          type: boolean
        successRatePercent:
          example: 99.8
          type: number
        errorRatePercent:
          example: 0.05
          type: number
        observationMinutes:
          example: 15
          type: integer
        evaluatedAt:
          format: date-time
          type: string
      type: object
    ReleaseTrain_waves_inner:
      example:
        completedAt: 2000-01-23T04:56:07.000+00:00
        gateResult:
          successRatePercent: 99.8
          observationMinutes: 15
          passed: true
          evaluatedAt: 2000-01-23T04:56:07.000+00:00
          errorRatePercent: 0.05
        repositories:
        - forgesphere/discount-engine
        name: foundation-libs
        startedAt: 2000-01-23T04:56:07.000+00:00
        strategy: CANARY_5_PERCENT
        waveNumber: 1
        status: PASSED
      properties:
        waveNumber:
          example: 1
          type: integer
        name:
          example: foundation-libs
          type: string
        status:
          enum:
          - PENDING
          - RUNNING
          - AWAITING_GATE
          - PASSED
          - FAILED
          - ROLLED_BACK
          - SKIPPED
          example: PASSED
          type: string
        repositories:
          example:
          - forgesphere/discount-engine
          items:
            type: string
          type: array
        strategy:
          enum:
          - SEQUENTIAL
          - PARALLEL
          - CANARY_5_PERCENT
          - CANARY_25_PERCENT
          - BLUE_GREEN
          example: CANARY_5_PERCENT
          type: string
        startedAt:
          format: date-time
          type: string
        completedAt:
          format: date-time
          type: string
        gateResult:
          $ref: "#/components/schemas/ReleaseTrain_waves_inner_gateResult"
      required:
      - name
      - repositories
      - status
      - waveNumber
      type: object
    TrainHistory_events_inner:
      example:
        actor: release-bot@forgesphere.example.com
        eventId: a1b2c3d4-e5f6-7890-1234-567890abcdef
        repoId: forgesphere/discount-engine
        occurredAt: 2000-01-23T04:56:07.000+00:00
        metadata:
          deployedVersion: v2.5.0
          durationSeconds: 272
        eventType: WAVE_COMPLETED
        detail: Wave 1 deployed successfully in 4m 32s.
        waveNumber: 1
      properties:
        eventId:
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
          format: uuid
          type: string
        eventType:
          enum:
          - TRAIN_CREATED
          - VALIDATION_PASSED
          - VALIDATION_FAILED
          - WAVE_STARTED
          - WAVE_COMPLETED
          - GATE_PASSED
          - GATE_FAILED
          - PAUSED
          - RESUMED
          - ROLLBACK_STARTED
          - ROLLBACK_COMPLETED
          - TRAIN_SUCCEEDED
          - TRAIN_FAILED
          - ABORTED
          example: WAVE_COMPLETED
          type: string
        waveNumber:
          example: 1
          type: integer
        repoId:
          example: forgesphere/discount-engine
          type: string
        occurredAt:
          format: date-time
          type: string
        actor:
          example: release-bot@forgesphere.example.com
          type: string
        detail:
          example: Wave 1 deployed successfully in 4m 32s.
          type: string
        metadata:
          additionalProperties: true
          example:
            deployedVersion: v2.5.0
            durationSeconds: 272
          type: object
      required:
      - actor
      - eventId
      - eventType
      - occurredAt
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: JWT token issued to release managers or CI/CD pipelines.
      scheme: bearer
      type: http
