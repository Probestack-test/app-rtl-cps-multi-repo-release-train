openapi: 3.1.0
info:
  title: Multi-Repo Release Train
  description: "Coordinates atomic, coordinated releases across multiple interdependent\
    \  repositories. Prevents the classic \"repo A shipped, repo B didn't,  production\
    \ broke\" problem by enforcing that all required repos are  ready before any can\
    \ deploy. Manages version pinning, release waves,  and rollback of the entire\
    \ train. "
  contact:
    name: ForgeSphere Release Engineering
    email: release@forgesphere.example.com
  version: 1.0.0
servers:
- url: http://127.0.0.1:18080
  description: Generated server url
tags:
- name: Trains
  description: Create and manage multi-repo release trains.
paths:
  /v1/trains:
    post:
      tags:
      - Trains
      summary: Create a new multi-repo release train
      description: "Defines a release train — a group of repositories that must ship\
        \  together in a specific order. The train enforces dependency order,  version\
        \ pinning, and success gates between waves. Nothing deploys  until the entire\
        \ train is validated. "
      operationId: createReleaseTrain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseTrainRequest"
        required: true
      responses:
        "201":
          description: Release train created and validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A train with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/trains/{trainId}/execute:
    post:
      tags:
      - Trains
      summary: "Start, pause, resume, or rollback the release train"
      description: "Controls the release train lifecycle. Actions: START begins the\
        \  first wave, PAUSE halts after the current wave, RESUME continues  from\
        \ where it stopped, ROLLBACK reverts per the train's rollback  policy. Every\
        \ action is audited. "
      operationId: executeTrainAction
      parameters:
      - name: trainId
        in: path
        description: Unique identifier of the release train.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteTrainActionRequest"
        required: true
      responses:
        "200":
          description: Action applied successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
        "400":
          description: Invalid request payload or missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Train ID not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Train is not in a state that supports this action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/trains/{trainId}:
    get:
      tags:
      - Trains
      summary: Get live status of a release train
      description: "Returns the current state of the release train — which wave is\
        \  active, which repositories are deployed, success-gate results, and  any\
        \ blockers. Safe to poll every 10 seconds during an active release. "
      operationId: getReleaseTrain
      parameters:
      - name: trainId
        in: path
        description: Unique identifier of the release train.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Release train status retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseTrain"
        "404":
          description: Train ID not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/trains/{trainId}/history:
    get:
      tags:
      - Trains
      summary: Get the full execution history of a release train
      description: "Returns a chronological timeline of everything that happened during\
        \  the train — wave transitions, gate results, rollbacks, and the final  outcome.\
        \ Used for post-release review and compliance audits. "
      operationId: getTrainHistory
      parameters:
      - name: trainId
        in: path
        description: Unique identifier of the release train.
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: Page number (zero-based).
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
      responses:
        "200":
          description: Historical timeline of the train.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainHistory"
        "404":
          description: Train ID not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    ReleaseTrain:
      type: object
      properties:
        trainId:
          type: string
          format: uuid
          example: 9c8f1a3b-6d7e-4a12-8f5e-123456789abc
        trainName:
          type: string
          example: payment-platform-v2.5
        description:
          type: string
          example: Q4 payment platform release with new discount engine.
        environment:
          type: string
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
        status:
          type: string
          enum:
          - DRAFT
          - VALIDATING
          - READY
          - RUNNING
          - PAUSED
          - SUCCEEDED
          - FAILED
          - ROLLING_BACK
          - ROLLED_BACK
          - ABORTED
          example: RUNNING
        targetReleaseDate:
          type: string
          format: date
          example: Thu Oct 15 00:00:00 GMT 2026
        currentWave:
          type: integer
          format: int32
          description: "Wave currently being deployed (1-indexed, 0 if not started)."
          example: 2
        totalWaves:
          type: integer
          format: int32
          example: 3
        progressPercent:
          type: integer
          format: int32
          example: 62
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrainRepositoriesInner"
        waves:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseTrainWavesInner"
        rollbackPolicy:
          type: string
          enum:
          - ROLLBACK_ALL
          - ROLLBACK_WAVE
          - ROLLBACK_FAILED_ONLY
          - MANUAL
          example: ROLLBACK_WAVE
        owner:
          type: string
          example: payments-platform-team
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        blockers:
          type: array
          description: Reasons the train cannot proceed.
          example:
          - forgesphere/checkout-service v1.9.0 has not passed tests.
          - forgesphere/discount-engine dependency conflict detected.
          items:
            type: string
      required:
      - createdAt
      - currentWave
      - environment
      - repositories
      - status
      - totalWaves
      - trainId
      - trainName
      - waves
    ReleaseTrainRepositoriesInner:
      type: object
      properties:
        repoId:
          type: string
          example: forgesphere/payment-service
        requiredVersion:
          type: string
          example: v2.5.0
        criticalPath:
          type: boolean
          example: true
        deployed:
          type: boolean
          example: true
        deployedAt:
          type: string
          format: date-time
        deployedVersion:
          type: string
          example: v2.5.0
        readinessStatus:
          type: string
          enum:
          - PENDING
          - READY
          - MISSING
          - INCOMPATIBLE
          example: READY
        dependsOn:
          type: array
          example:
          - forgesphere/discount-engine
          items:
            type: string
      required:
      - criticalPath
      - deployed
      - repoId
      - requiredVersion
    ReleaseTrainWavesInner:
      type: object
      properties:
        waveNumber:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: foundation-libs
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - AWAITING_GATE
          - PASSED
          - FAILED
          - ROLLED_BACK
          - SKIPPED
          example: PASSED
        repositories:
          type: array
          example:
          - forgesphere/discount-engine
          items:
            type: string
        strategy:
          type: string
          enum:
          - SEQUENTIAL
          - PARALLEL
          - CANARY_5_PERCENT
          - CANARY_25_PERCENT
          - BLUE_GREEN
          example: CANARY_5_PERCENT
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        gateResult:
          $ref: "#/components/schemas/ReleaseTrain_waves_inner_gateResult"
      required:
      - name
      - repositories
      - status
      - waveNumber
    ReleaseTrain_waves_inner_gateResult:
      type: object
      description: Result of the success gate for this wave.
      properties:
        passed:
          type: boolean
          example: true
        successRatePercent:
          type: number
          example: 99.8
        errorRatePercent:
          type: number
          example: 0.05
        observationMinutes:
          type: integer
          format: int32
          example: 15
        evaluatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          example: 409
        errorCode:
          type: string
          example: TRAIN_ALREADY_RUNNING
        message:
          type: string
          example: Release train payment-platform-v2.5 is already running.
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /v1/trains/9c8f1a3b/execute
        serviceTransactionId:
          type: string
          example: 523f52b2-64a5-465e-b245-3efbe78f70ae
      required:
      - message
      - path
      - status
      - timestamp
    CreateReleaseTrainRequest:
      type: object
      properties:
        trainName:
          type: string
          description: Unique name for this release train.
          example: payment-platform-v2.5
        description:
          type: string
          description: Optional description of the release scope.
          example: Q4 payment platform release with new discount engine.
        environment:
          type: string
          description: Target environment for the train.
          enum:
          - STAGING
          - PRODUCTION
          example: PRODUCTION
        targetReleaseDate:
          type: string
          format: date
          description: Planned release date.
          example: Thu Oct 15 00:00:00 GMT 2026
        repositories:
          type: array
          description: All repositories participating in this train.
          items:
            $ref: "#/components/schemas/CreateReleaseTrainRequestRepositoriesInner"
        waves:
          type: array
          description: Ordered deployment waves.
          items:
            $ref: "#/components/schemas/CreateReleaseTrainRequestWavesInner"
        rollbackPolicy:
          type: string
          description: How to roll back if a wave fails.
          enum:
          - ROLLBACK_ALL
          - ROLLBACK_WAVE
          - ROLLBACK_FAILED_ONLY
          - MANUAL
          example: ROLLBACK_WAVE
        owner:
          type: string
          description: Team owning this train.
          example: payments-platform-team
        notifyChannels:
          type: array
          description: Channels to notify on train events.
          example:
          - SLACK
          - PAGERDUTY
          items:
            type: string
            enum:
            - EMAIL
            - SLACK
            - PAGERDUTY
            - WEBHOOK
      required:
      - environment
      - repositories
      - trainName
      - waves
    CreateReleaseTrainRequestRepositoriesInner:
      type: object
      properties:
        repoId:
          type: string
          example: forgesphere/payment-service
        requiredVersion:
          type: string
          description: Version or commit that must be deployed.
          example: v2.5.0
        criticalPath:
          type: boolean
          description: "If true, the train blocks if this repo isn't ready."
          example: true
        dependsOn:
          type: array
          description: Other repos this one depends on.
          example:
          - forgesphere/discount-engine
          items:
            type: string
      required:
      - criticalPath
      - repoId
      - requiredVersion
    CreateReleaseTrainRequestWavesInner:
      type: object
      properties:
        waveNumber:
          type: integer
          format: int32
          example: 1
        name:
          type: string
          example: foundation-libs
        repositories:
          type: array
          example:
          - forgesphere/discount-engine
          items:
            type: string
        strategy:
          type: string
          enum:
          - SEQUENTIAL
          - PARALLEL
          - CANARY_5_PERCENT
          - CANARY_25_PERCENT
          - BLUE_GREEN
          example: CANARY_5_PERCENT
        successGate:
          $ref: "#/components/schemas/createReleaseTrain_request_waves_inner_successGate"
      required:
      - name
      - repositories
      - strategy
      - waveNumber
    createReleaseTrain_request_waves_inner_successGate:
      type: object
      description: Conditions required before moving to the next wave.
      properties:
        minSuccessRatePercent:
          type: number
          example: 99.5
        maxErrorRatePercent:
          type: number
          example: 0.1
        observationMinutes:
          type: integer
          format: int32
          example: 15
    ExecuteTrainActionRequest:
      type: object
      properties:
        action:
          type: string
          description: Action to perform on the train.
          enum:
          - START
          - PAUSE
          - RESUME
          - ROLLBACK
          - ABORT
          example: START
        reason:
          type: string
          description: Reason for the action (min 15 chars).
          example: All pre-flight checks passed; starting release.
          maxLength: 2147483647
          minLength: 15
        targetWave:
          type: integer
          format: int32
          description: Optional. Start or rollback from a specific wave.
          example: 1
        notifyChannels:
          type: array
          description: Channels to notify of this action.
          example:
          - SLACK
          items:
            type: string
            enum:
            - EMAIL
            - SLACK
            - PAGERDUTY
            - WEBHOOK
      required:
      - action
      - reason
    TrainHistory:
      type: object
      properties:
        trainId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrainHistoryEventsInner"
        totalElements:
          type: integer
          format: int32
          example: 42
        totalPages:
          type: integer
          format: int32
          example: 1
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 50
      required:
      - events
      - totalElements
      - totalPages
      - trainId
    TrainHistoryEventsInner:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-1234-567890abcdef
        eventType:
          type: string
          enum:
          - TRAIN_CREATED
          - VALIDATION_PASSED
          - VALIDATION_FAILED
          - WAVE_STARTED
          - WAVE_COMPLETED
          - GATE_PASSED
          - GATE_FAILED
          - PAUSED
          - RESUMED
          - ROLLBACK_STARTED
          - ROLLBACK_COMPLETED
          - TRAIN_SUCCEEDED
          - TRAIN_FAILED
          - ABORTED
          example: WAVE_COMPLETED
        waveNumber:
          type: integer
          format: int32
          example: 1
        repoId:
          type: string
          example: forgesphere/discount-engine
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          example: release-bot@forgesphere.example.com
        detail:
          type: string
          example: Wave 1 deployed successfully in 4m 32s.
        metadata:
          type: object
          additionalProperties: {}
          example:
            deployedVersion: v2.5.0
            durationSeconds: 272
      required:
      - actor
      - eventId
      - eventType
      - occurredAt
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            api.read: Read access to the API
            api.write: Write access to the API
